<script>
  // Open external links (Scholar, papers, email etc.) in a new tab; keep site pages in the same tab.
  document.querySelectorAll('a[href]').forEach(function (a) {
    if (a.hostname && a.hostname !== window.location.hostname) {
      a.target = '_blank';
      a.rel = 'noopener';
    }
  });
</script>
